<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS — Asistente Personal</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="contenedor">
        <!-- Cabeza del Robot Animada -->
        <div class="robot-cabeza">
            <div class="antena"></div>
            <div class="cara">
                <div class="ojos">
                    <div class="ojo izquierdo" id="ojoIzq"></div>
                    <div class="ojo derecho" id="ojoDer"></div>
                </div>
                <div class="boca" id="boca"></div>
            </div>
        </div>

        <div class="cabezal">
            <h1>J.A.R.V.I.S</h1>
            <p class="subtitulo" id="estadoSistema">Sistema Activo — Esperando...</p>
        </div>

        <div class="pantalla">
            <div id="historial" class="historial">
                <p class="mensaje jarvis">Sistema en línea. Haz un clic para activarme...</p>
            </div>
        </div>

        <div class="controles">
            <button id="btnEscuchar" class="btn-escuchar">🔊 Activar Escucha</button>
            <button id="btnLimpiar" class="btn-limpiar">Limpiar</button>
        </div>
    </div>

    <script src="logica.js"></script>
</body>
</html>
