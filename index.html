<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS — Asistente de Alexis</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="contenedor">

        <!-- SNOOPY ANIMADO -->
        <div class="snoopy-contenedor">
            <div class="snoopy" id="snoopy">
                <div class="cabeza">
                    <div class="oreja izquierda"></div>
                    <div class="oreja derecha"></div>
                    <div class="cara">
                        <div class="ojos">
                            <div class="ojo" id="ojoIzq"></div>
                            <div class="ojo" id="ojoDer"></div>
                        </div>
                        <div class="nariz"></div>
                        <div class="boca" id="boca"></div>
                    </div>
                </div>
                <div class="cuerpo">
                    <div class="pechera"></div>
                </div>
            </div>
        </div>

        <div class="cabezal">
            <h1>J.A.R.V.I.S</h1>
            <p class="subtitulo" id="estadoSistema">Sistema Activo — Conectado</p>
        </div>

        <div class="pantalla">
            <div id="historial" class="historial">
                <p class="mensaje jarvis">Iniciando sistema...</p>
            </div>
        </div>

        <div class="controles">
            <button id="btnEscuchar" class="btn-escuchar">🔊 Activar Escucha</button>
            <button id="btnLimpiar" class="btn-limpiar">Limpiar Pantalla</button>
        </div>
    </div>

    <script src="logica.js"></script>
</body>
</html>
