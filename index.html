<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. — Sistema Activo</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="escaner"></div>
    <div class="contenedor-principal">
        <div class="cabecera">
            <div class="logo">
                <span class="letra">J</span>.<span class="letra">A</span>.<span class="letra">R</span>.<span class="letra">V</span>.<span class="letra">I</span>.<span class="letra">S</span>.
            </div>
            <p class="subtitulo">Sistema de Asistencia Virtual — En Línea</p>
            <div class="estado">
                <span class="punto-luz"></span>
                <span id="texto-estado">Activo y funcionando</span>
            </div>
        </div>

        <div id="pantalla-conversacion" class="pantalla-conversacion">
            <!-- Aquí aparecen los mensajes -->
        </div>

        <form id="formulario-entrada" class="barra-entrada">
            <input 
                type="text" 
                id="campo-pregunta" 
                placeholder="¿En qué puedo asistirle, señor?" 
                autocomplete="off"
            >
            <button type="submit" id="boton-enviar">Transmitir</button>
        </form>
    </div>

    <script src="logica-jarvis.js"></script>
</body>
</html>
