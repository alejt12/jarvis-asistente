<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. — Señor Alexis</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

<div class="fondo"></div>
<div class="contenedor-principal">

    <!-- Robot animado -->
    <div class="seccion-robot">
        <div id="robot" class="robot">
            <div class="cabeza">
                <div class="ojo izquierdo"></div>
                <div class="ojo derecho"></div>
            </div>
            <div class="cuerpo">
                <div class="brazos">
                    <div class="brazo izquierdo"></div>
                    <div class="brazo derecho"></div>
                </div>
            </div>
        </div>
        <p id="estado-robot">En espera...</p>
    </div>

    <!-- Cabecera -->
    <div class="cabecera">
        <h1>J.A.R.V.I.S.</h1>
        <p>Sistema de Asistencia Virtual — Activo</p>
        <div class="linea"></div>
    </div>

    <!-- Chat -->
    <div id="pantalla" class="pantalla">
        <!-- Mensajes aquí -->
    </div>

    <!-- Entrada -->
    <form id="formulario" class="barra">
        <input type="text" id="entrada" placeholder="Escriba su consulta, señor Alexis..." autocomplete="off">
        <button type="submit">Transmitir</button>
    </form>
</div>

<script src="cerebro.js"></script>
</body>
</html>
